version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: stratos_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stratos_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-StratosSecure2026}
      POSTGRES_DB: ${POSTGRES_DB:-stratosai_core}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stratos_admin -d stratosai_core"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:6.0
    container_name: stratos_mongo
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7.0-alpine
    container_name: stratos_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

  ml-api:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: stratos_ml_api
    ports:
      - "${ML_API_PORT:-5001}:5001"
    environment:
      - MODEL_PATH=/app/models
    volumes:
      - ./ml:/app

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: stratos_backend_api
    ports:
      - "${BACKEND_PORT:-8080}:3001" # NestJS typically runs on 3001 in our setup
    environment:
      - DATABASE_URL=postgresql://stratos_admin:StratosSecure2026@postgres:5432/stratosai_core?schema=public
      - MONGODB_URI=mongodb://mongodb:27017/stratosai
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ML_API_URL=http://ml-api:5001
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mongodb:
        condition: service_started

volumes:
  postgres_data:
  mongo_data:
  redis_data:
